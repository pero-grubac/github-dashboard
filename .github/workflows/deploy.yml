name: Deploy

on:
  # Runs after CI has passed on main, so the tests aren't run twice.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # Daily data refresh: rebuilds the site with a fresh GitHub snapshot.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI just tested (workflow_run), otherwise the current one.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Raw GitHub data for the default profile -> public/data/<user>.json.
      # The token stays in this step and never reaches the bundle. Without the
      # secret it runs unauthenticated (no pinned repos, no heatmap). If GitHub
      # refuses it (rate limit, expired token) the job stops, so the previous
      # deployment and its snapshot stay online instead of a site without one.
      - run: npm run snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SNAPSHOT_TOKEN }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
